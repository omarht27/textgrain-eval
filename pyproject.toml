[project]
name = "textgrain"
version = "0.1.0"
description = "Reimplementation and evaluation of the textGrain watermark on open-weights LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "datasets>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textgrain"]
